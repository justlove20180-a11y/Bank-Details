<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Details & Print Portal</title>
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #004085;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #ced4da;
        }

        body {
            background-image: url('https://agentbanking.southeastbank.com.bd/pi//emob/bg.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, SolaimanLipi, Arial;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bank-card {
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 25px;
            background: #fff;
            position: relative;
            margin-bottom: 25px;
        }

        .bank-header {
            text-align: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .bank-logo-img {
            max-height: 60px;
            max-width: 200px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .detail-row {
            display: flex;
            margin-bottom: 12px;
            align-items: center;
            border-bottom: 1px dashed #e9ecef;
            padding-bottom: 8px;
        }

        .detail-label {
            flex: 0 0 200px;
            font-weight: bold;
            color: #495057;
            font-size: 14px;
        }

        .detail-value {
            flex: 1;
            font-size: 15px;
            color: #212529;
        }

        /* Form Controls for Editing */
        .editor-section {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .editor-section h3 {
            margin-top: 0;
            font-size: 18px;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-container {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 0 5px;
        }

        .btn:hover {
            background-color: var(--secondary);
        }

        .opt-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 5px;
            transition: background 0.2s;
        }

        .opt-btn:hover {
            background-color: #218838;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
                width: 100%;
            }
            .editor-section, .btn-container, h1 {
                display: none !important;
            }
            .bank-card {
                border: 2px solid #000 !important;
                box-shadow: none;
                page-break-inside: avoid;
                margin: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bank Details Print Portal</h1>

    <!-- Interactive Editor Section -->
    <div class="editor-section">
        <h3> Edit Details </h3>
       
        <div class="form-group">
            <label for="input-acc-num">Account Number:</label>
            <input type="text" id="input-acc-num" class="form-control" value="">
        </div>
        <div class="form-group">
            <label for="input-acc-title">Account Title:</label>
            <input type="text" id="input-acc-title" class="form-control" value="">
        </div>
        <div class="form-group">
            <label for="input-branch">Branch:</label>
            <input type="text" id="input-branch" class="form-control" value="AGENT BANKING DIVISION (DHAKA SOUTH).">
        </div>
        
        <!-- Routing Number Option Buttons -->
        <div class="form-group">
            <label>Select Routing Number:</label>
            <button type="button" class="opt-btn" onclick="setRouting('205270606')">Conventional (205270606)</button>
            <button type="button" class="opt-btn" onclick="setRouting('205270819')">Islamic (205270819)</button>
        </div>

        <div class="form-group">
            <label for="input-routing">Routing Number:</label>
            <input type="text" id="input-routing" class="form-control" value="205270606">
        </div>
        <div class="form-group">
            <label for="input-branch-code">Branch Code:</label>
            <input type="text" id="input-branch-code" class="form-control" value="1007">
        </div>
        <div class="form-group">
            <label for="input-swift">Swift Code:</label>
            <input type="text" id="input-swift" class="form-control" value="SEBDBDDH">
        </div>
        <div class="form-group">
            <label for="input-office">Office Number:</label>
            <input type="text" id="input-office" class="form-control" value="01679890011">
        </div>
    </div>

    <!-- Printable Bank Card Preview -->
    <div class="bank-card" id="printableArea">
        <div class="bank-header">
            <!-- Bank Logo Display Area -->
            <div id="logo-container">
                <img src="https://www.southeastbank.com.bd/images/logo/logo_sebplc_new.jpg" width="400" height="80">
            </div>
            <p style="margin: 0px 0 0 0; font-size: 13px; color: #666;">Account Information / Bank Details</p>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">ACCOUNT NUMBER</div>
            <div class="detail-value" id="display-acc-num"></div>
        </div>
        <div class="detail-row">
            <div class="detail-label">ACCOUNT TITLE</div>
            <div class="detail-value" id="display-acc-title"></div>
        </div>
        <div class="detail-row">
            <div class="detail-label">BRANCH</div>
            <div class="detail-value" id="display-branch">AGENT BANKING DIVISION (DHAKA SOUTH) .</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">ROUTING NUMBER</div>
            <div class="detail-value" id="display-routing">205270606</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">BRANCH CODE</div>
            <div class="detail-value" id="display-branch-code">1007</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">SWIFT CODE</div>
            <div class="detail-value" id="display-swift">SEBDBDDH</div>
        </div>
        <div class="detail-row" style="border-bottom: none;">
            <div class="detail-label">OFFICE NUMBER</div>
            <div class="detail-value" id="display-office">01679890011</div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-container">
        <button class="btn" onclick="window.print()">🖨️ Print </button>
    </div>
</div>

<script>
    // Function to set Routing Number on button click
    function setRouting(val) {
        document.getElementById('input-routing').value = val;
        document.getElementById('display-routing').textContent = val;
    }

    // Live binding between inputs and display card
    const mappings = [
        { input: 'input-acc-num', display: 'display-acc-num' },
        { input: 'input-acc-title', display: 'display-acc-title' },
        { input: 'input-branch', display: 'display-branch' },
        { input: 'input-routing', display: 'display-routing' },
        { input: 'input-branch-code', display: 'display-branch-code' },
        { input: 'input-swift', display: 'display-swift' },
        { input: 'input-office', display: 'display-office' }
    ];

    mappings.forEach(item => {
        const inputElem = document.getElementById(item.input);
        const displayElem = document.getElementById(item.display);

        if (inputElem && displayElem) {
            inputElem.addEventListener('input', () => {
                displayElem.textContent = inputElem.value;
            });
        }
    });
</script>

</body>
</html>
